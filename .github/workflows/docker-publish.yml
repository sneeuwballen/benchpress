name: docker publish

on:
  workflow_call:
    inputs:
      image-name:
        description: ghcr image name, defaults to the calling repository (owner/name)
        type: string
        required: false
      context:
        description: build context
        type: string
        default: .
      file:
        description: path to the Dockerfile, relative to the workspace
        type: string
        default: Dockerfile
      submodules:
        description: check out submodules recursively
        type: boolean
        default: false

permissions:
  contents: read
  packages: write

jobs:
  docker:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      IMAGE: ghcr.io/${{ inputs.image-name || github.repository }}
    steps:
      - uses: actions/checkout@v6
        with:
          submodules: ${{ inputs.submodules }}
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/build-push-action@v6
        with:
          context: ${{ inputs.context }}
          file: ${{ inputs.file }}
          push: true
          tags: |
            ${{ env.IMAGE }}:latest
            ${{ env.IMAGE }}:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
